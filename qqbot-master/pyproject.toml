[project]
name = "test-bot"
version = "0.1.0"
description = "test-bot"
readme = "README.md"
requires-python = ">=3.9, <4.0"
dependencies = [
    "nonebot-adapter-qq>=1.6.5",
    "nonebot2[websockets]>=2.4.4",
    "nonebot2",
    "nonebot2[fastapi]>=2.4.4",
    "nonebot2[httpx]>=2.4.4",
]

[tool.nonebot]
plugin_dirs = ["test-bot/plugins"]
builtin_plugins = ["echo"]

[tool.nonebot.adapters]
"@local" = []
nonebot-adapter-qq = [{name = "QQ", module_name = "nonebot.adapters.qq"}]

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-jmcomic = ["nonebot_plugin_jmcomic"]
